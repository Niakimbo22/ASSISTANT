name: Build APK

on:
  push:
    branches:
      - "claude/nicoassistant-voice-app-xpz7pr"
      - "claude/lot1-socle-donnees-mbecj8"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Le socle de données et le moteur de matching sont testables sans appareil :
      # ils doivent passer avant qu'on assemble quoi que ce soit (spec §11).
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoAssistant-debug
          path: app/build/outputs/apk/debug/*.apk
