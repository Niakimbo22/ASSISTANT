name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch:

# Nécessaire pour créer la release et y attacher l'APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # `github.run_number` s'incrémente à chaque exécution du workflow : c'est lui
      # qui devient BUILD_NUMBER dans l'app, versionCode de l'APK, et tag de release.
      BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Le socle de données et le moteur de matching sont testables sans appareil :
      # ils doivent passer avant qu'on assemble quoi que ce soit (spec §11).
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -PbuildNumber=$BUILD_NUMBER

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Clé de signature fixe : sans elle, chaque runner signerait avec une clé
      # debug aléatoire et Android refuserait d'installer le nouvel APK par-dessus
      # l'ancien. Voir docs/MISE_A_JOUR.md pour créer les secrets.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "NICO_KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Warn about missing keystore
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Secret KEYSTORE_BASE64 absent — l'APK sera signé avec une clé debug aléatoire et ne pourra pas s'installer par-dessus une version précédente. Voir docs/MISE_A_JOUR.md."

      - name: Build Release APK
        env:
          NICO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NICO_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'nicoassistant' }}
          NICO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PbuildNumber=$BUILD_NUMBER

      - name: Rename APK
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$src" ]; then
            echo "::error::Aucun APK produit par assembleRelease"
            exit 1
          fi
          dest="NicoAssistant-build-$BUILD_NUMBER.apk"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NicoAssistant-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      # L'app interroge /releases/latest : l'asset d'une release se télécharge sans
      # jeton, contrairement à un artefact Actions. C'est toute la raison d'être
      # de cette étape.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          TAG="build-$BUILD_NUMBER"
          NOTES=$(printf '%s\n\n%s\n' \
            "Build $BUILD_NUMBER — branche \`$GITHUB_REF_NAME\`, commit \`${GITHUB_SHA:0:7}\`." \
            "Installable depuis l'app : Réglages système → Vérifier les mises à jour.")

          # Une ré-exécution du même run réutilise le même run_number, donc le même
          # tag : on remplace l'asset au lieu d'échouer sur « release already exists ».
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Build $BUILD_NUMBER" \
              --notes "$NOTES"
          fi

          echo "APK publié : https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
